# ============================================================
# CMIOT AX18 OpenWrt 云编译工作流
# 基于 coolsnowwolf/lede 源码，GitHub Actions 云编译
# 触发方式：
#   1) Actions 页面手动点击 Run workflow（推荐）
#   2) 推送 .config / diy-*.sh / 本文件 到 main 或 master 分支
# ============================================================
name: Build OpenWrt - CMIOT AX18

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - ".config"
      - "diy-part1.sh"
      - "diy-part2.sh"
      - ".github/workflows/*.yml"

# 同一分支只排队一个构建，不打断正在跑的那个
concurrency:
  group: build-openwrt-${{ github.ref }}
  cancel-in-progress: false

env:
  # 源码仓库：默认 coolsnowwolf/lede（原版，无 WiFi，见 README §4）
  # 如需 WiFi，改为：https://github.com/AnClark/lede-zn-m2-wifi
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  # 是否自动发布到 GitHub Releases（true / false）
  UPLOAD_RELEASE: "true"
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    # README 预估 1.5~3 小时，留足余量后强制收工，避免卡死占用配额
    timeout-minutes: 300
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: 初始化编译环境
        run: |
          sudo timedatectl set-timezone "$TZ"
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev libjson-c-dev

      - name: 克隆 lede 源码
        run: |
          git clone --depth=1 --single-branch --branch "$REPO_BRANCH" "$REPO_URL" openwrt

      - name: 预处理（feeds 更新前执行 diy-part1.sh）
        run: |
          [ -e "$DIY_P1_SH" ] && bash "$DIY_P1_SH" || true

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 载入自定义配置与脚本（diy-part2.sh）
        run: |
          [ -e files ] && mv files openwrt/files || true
          [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
          cd openwrt
          bash "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: 生成完整配置并校验目标机型
        run: |
          cd openwrt
          make defconfig
          echo "=== 平台符号 ==="
          grep -E '^CONFIG_TARGET_qualcommax=y'                          .config || {
            echo "::error::defconfig 后 CONFIG_TARGET_qualcommax 丢失"; exit 1; }
          grep -E '^CONFIG_TARGET_qualcommax_ipq60xx=y'                  .config || {
            echo "::error::defconfig 后 CONFIG_TARGET_qualcommax_ipq60xx 丢失"; exit 1; }
          grep -E '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_cmiot_ax18=y' .config || {
            echo "::error::defconfig 后 cmiot_ax18 机型丢失，编出来的是别的设备，终止"
            exit 1
          }
          echo "=== 启用的 luci-app ==="
          grep -E '^CONFIG_PACKAGE_luci-app.*=y' .config | sed 's/CONFIG_PACKAGE_//;s/=y//'
          df -h /

      - name: 下载软件包
        run: |
          cd openwrt
          downloaded=0
          for i in 1 2 3; do
            if make download -j8; then
              downloaded=1
              break
            fi
            echo "软件包下载失败，第 $i 次重试..."
            sleep 5
          done
          if [ "$downloaded" != 1 ]; then
            echo "::error::软件包下载三轮均失败，终止构建"
            exit 1
          fi

      - name: 编译固件
        run: |
          cd openwrt
          echo "开始编译（CPU $(nproc) 核，预计 1.5~3 小时）"
          if ! make -j$(nproc) V=s; then
            echo "::error::编译失败，向上翻日志找第一个 error"
            exit 1
          fi

      - name: 收集产物
        run: |
          set -euo pipefail
          mkdir -p artifact
          found=0
          for d in openwrt/bin/targets/*/*/; do
            [ -e "$d" ] || continue
            cp -r "$d"* artifact/ 2>/dev/null && found=1
          done
          if [ "$found" != 1 ] || [ -z "$(ls -A artifact)" ]; then
            echo "::error::bin/targets 下没有任何产物，编译实际未产出固件"
            exit 1
          fi
          echo "=== 产物清单 ==="
          ls -lhR artifact/

      - name: 校验 factory / sysupgrade 包
        run: |
          set -euo pipefail
          ls artifact/*-factory.bin || {
            echo "::error::缺少 factory.bin（原厂后台首次刷机要用）"; exit 1; }
          ls artifact/*-sysupgrade.bin || {
            echo "::error::缺少 sysupgrade.bin（OpenWrt 内升级要用）"; exit 1; }
          echo "=== 校验值 ==="
          [ -f artifact/sha256sums ] && (cd artifact && sha256sum -c sha256sums 2>&1 | tail -5) || true

      - name: 上传固件（Actions 附件，可下载 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: cmiot-ax18-openwrt
          path: artifact/
          retention-days: 30
          if-no-files-found: error

      - name: 发布 GitHub Release
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: "CMIOT AX18 固件 #${{ github.run_number }}"
          body: |
            机型：CMIOT AX18（和目 AX18 / IPQ6000 / 256MB / 128MB NAND）
            源码：${{ env.REPO_URL }}（分支 ${{ env.REPO_BRANCH }}）
            平台：qualcommax / ipq60xx / cmiot_ax18
            由 GitHub Actions 云编译自动发布
          files: artifact/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
